<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Durga Puja Dance Competition 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="header">
            <div class="om">ॐ</div>

            <h1>Durga Puja Dance Competition</h1>
            <p>2026</p>

            <div class="divider">✦ ✦ ✦</div>
        </div>

        <div class="registration-card">

            <h2>Participant Registration</h2>
            <p class="subtitle">Register now and be a part of the celebration!</p>

            <form>

                <div class="form-group">
                    <label>Participant Name *</label>
                    <input type="text" placeholder="Enter participant name" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" placeholder="Enter mobile number" required>
                </div>

                <div class="form-group">
                    <label>Age *</label>
                    <input type="number" placeholder="Enter age" min="1" max="100" required>
                </div>

                <div class="form-group">
                    <label>Category *</label>
                    <select required>
                        <option value="">Select Category</option>
                        <option value="Solo">Solo</option>
                        <option value="Duo">Duo</option>
                        <option value="Group">Group</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Participant Image *</label>
                    <input type="file" accept="image/*" required>
                    <small>Upload a clear participant photo</small>
                </div>

                <button type="submit">
                    SUBMIT REGISTRATION
                </button>

            </form>

        </div>

        <div class="footer">
            <p>🪔 शुभ दुर्गा पूजा 🪔</p>
            <span>© 2026 Durga Puja Dance Competition</span>
        </div>

    </div>
<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxsmlXNkcSuyH5XKkIOguaOPC1AR0N8Yi9KtV3-0SzyiD51D4CXIL_z8By4rXCH5mpe/exec";

const form = document.querySelector("form");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = form.querySelector('input[type="text"]').value;
    const mobile = form.querySelector('input[type="tel"]').value;
    const age = form.querySelector('input[type="number"]').value;
    const category = form.querySelector("select").value;

    const data = {
        name: name,
        mobile: mobile,
        age: age,
        category: category,
        image: ""
    };

    try {
        const response = await fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            alert(
                "Registration Successful!\n\nRegistration ID: " +
                result.registrationId
            );

            form.reset();
        } else {
            alert("Registration failed. Please try again.");
        }

    } catch (error) {
        console.error(error);
        alert("Something went wrong. Please try again.");
    }
});
</script>
</body>
</html>
