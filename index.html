<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Durga Puja Dance Competition 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="header">
            <div class="om">ॐ</div>

            <h1>Durga Puja Dance Competition</h1>
            <p>2026</p>

            <div class="divider">✦ ✦ ✦</div>
        </div>

        <div class="registration-card">

            <h2>Participant Registration</h2>
            <p class="subtitle">
                Register now and be a part of the celebration!
            </p>

            <form>

                <div class="form-group">
                    <label>Participant Name *</label>
                    <input
                        type="text"
                        name="name"
                        placeholder="Enter participant name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Age *</label>
                    <input
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        max="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category *</label>

                    <select name="category" required>
                        <option value="">Select Category</option>
                        <option value="Solo">Solo</option>
                        <option value="Duo">Duo</option>
                        <option value="Group">Group</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Participant Image *</label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required
                    >

                    <small>Upload a clear participant photo</small>
                </div>

                <button type="submit">
                    SUBMIT REGISTRATION
                </button>

            </form>

        </div>

        <div class="footer">
            <p>🪔 शुभ दुर्गा पूजा 🪔</p>
            <span>
                © 2026 Durga Puja Dance Competition
            </span>
        </div>

    </div>

<script>
const scriptURL =
"https://script.google.com/macros/s/AKfycbxsmlXNkcSuyH5XKkIOguaOPC1AR0N8Yi9KtV3-0SzyiD51D4CXIL_z8By4rXCH5mpe/exec";

const form = document.querySelector("form");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const submitButton = form.querySelector("button");

    submitButton.disabled = true;
    submitButton.textContent = "UPLOADING...";

    const name = form.querySelector('[name="name"]').value;
    const mobile = form.querySelector('[name="mobile"]').value;
    const age = form.querySelector('[name="age"]').value;
    const category = form.querySelector('[name="category"]').value;

    const imageInput = form.querySelector('[name="image"]');

    if (!imageInput.files.length) {
        alert("Please select participant image.");
        submitButton.disabled = false;
        submitButton.textContent = "SUBMIT REGISTRATION";
        return;
    }

    const file = imageInput.files[0];

    // Maximum image size: 2 MB
    if (file.size > 2 * 1024 * 1024) {
        alert("Please upload an image smaller than 2 MB.");
        submitButton.disabled = false;
        submitButton.textContent = "SUBMIT REGISTRATION";
        return;
    }

    const reader = new FileReader();

    reader.onload = async function() {

        const data = new URLSearchParams();

        data.append("name", name);
        data.append("mobile", mobile);
        data.append("age", age);
        data.append("category", category);
        data.append("imageData", reader.result);

        try {

            const response = await fetch(scriptURL, {
                method: "POST",
                body: data
            });

            const result = await response.json();

            if (result.success) {

                alert(
                    "Registration Successful!\n\n" +
                    "Registration ID: " +
                    result.registrationId
                );

                form.reset();

            } else {

                alert(
                    "Registration failed.\n\n" +
                    result.error
                );
            }

        } catch (error) {

            console.error(error);

            alert(
                "Something went wrong. Please try again."
            );

        }

        submitButton.disabled = false;
        submitButton.textContent =
            "SUBMIT REGISTRATION";
    };

    reader.readAsDataURL(file);
});
</script>
