<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durga Puja Dance Competition 2026</title>
</head>

<body>

    <h1>Durga Puja Dance Competition 2026</h1>

    <h2>Participant Registration</h2>

    <form>
        <label>Participant Name</label><br>
        <input type="text" required><br><br>

        <label>Mobile Number</label><br>
        <input type="tel" required><br><br>

        <label>Age</label><br>
        <input type="number" required><br><br>

        <label>Category</label><br>
        <select required>
            <option value="">Select Category</option>
            <option>Solo</option>
            <option>Duo</option>
            <option>Group</option>
        </select><br><br>

        <label>Participant Image</label><br>
        <input type="file" accept="image/*" required><br><br>

        <button type="submit">Submit Registration</button>
    </form>

</body>
</html>
